<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PainLab Platform">
  <title>PainLab Platform — Measurement / Physiology Exchange</title>
  <desc>An intensity meter above a physiological trace, linked by two curved arrows
        forming a bidirectional loop.</desc>
  <defs>
    <linearGradient id="i-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#4D9DCD"/>
      <stop offset="0.45" stop-color="#F49F66"/>
      <stop offset="1"    stop-color="#C2393C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1B2436"/>

  <!-- ===== exchange loop =====
       Two arcs on a circle centred (256,264) r=172, 180°-rotationally symmetric.
       Left descends (measurement -> physiology), right ascends (physiology -> measurement).

       opacity lives on the GROUP, not on fill-opacity/stroke-opacity per shape:
       each arrowhead overlaps its arc's round cap, and per-shape alpha would
       composite the two separately and leave a bright disc inside the head. -->
  <g opacity="0.5" fill="#FFFFFF" stroke="#FFFFFF">

    <!-- meter -> trace -->
    <path d="M115.1 165.3 A172 172 0 0 0 115.1 362.7"
          fill="none" stroke-width="18" stroke-linecap="round"/>
    <path d="M138.04 395.47 L96.10 368.68 L127.22 346.88 Z" stroke="none"/>

    <!-- trace -> meter -->
    <path d="M396.9 362.7 A172 172 0 0 0 396.9 165.3"
          fill="none" stroke-width="18" stroke-linecap="round"/>
    <path d="M373.96 132.53 L415.90 159.32 L384.78 181.12 Z" stroke="none"/>
  </g>

  <!-- ===== intensity meter, upper ===== -->
  <path d="M177.07 200.73 A84 84 0 1 1 334.93 200.73"
        fill="none" stroke="url(#i-arc)" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 172 L308.4 135.3"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
  <circle cx="256" cy="172" r="16" fill="#FFFFFF"/>

  <!-- ===== physiological trace, lower ===== -->
  <path d="M164 374 H208 L232 306 L262 440 L294 338 L316 374 H348"
        fill="none" stroke="#5FB0DC" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
